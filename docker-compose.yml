version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: chat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xieming562}
      MYSQL_DATABASE: chat
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-xieming562}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - eruitah-net

  redis:
    image: redis/redis-stack:latest
    container_name: chat-redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: --requirepass ${REDIS_PASSWORD:-123456}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eruitah-net

  neo4j:
    image: neo4j:latest
    container_name: chat-neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-12345678}
      NEO4J_PLUGINS: '["apoc"]'
      TZ: Asia/Shanghai
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - eruitah-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: chat-rabbitmq
    restart: always
    ports:
      - "5672:5672"     # AMQP 原生端口（Java/Python 后端连接）
      - "15672:15672"   # Web 管理控制台
      - "1883:1883"     # MQTT 端口（C++ 桌面端连接）
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: eruitah2026
    # 启动时启用 MQTT 插件，然后启动 RabbitMQ 服务
    command: >
      bash -c "rabbitmq-plugins enable rabbitmq_mqtt && rabbitmq-server"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - eruitah-net

  chatserver:
    build:
      context: .
      dockerfile: Dockerfile.chatserver
    container_name: chat-server
    restart: always
    ports:
      - "6000:6000"
      - "8888:8888"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xieming562}
      MYSQL_DBNAME: chat
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      AI_SERVICE_URL: http://ai-service:8081/api/ai/chat
      AI_SERVICE_BASE_URL: http://ai-service:8081
      JAVA_RPC_HOST: ai-service
      JAVA_RPC_PORT: 9999
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eruitah-net

  sandbox:
    build:
      context: ./eruitah-sandbox
      dockerfile: Dockerfile
    container_name: chat-sandbox
    restart: always
    ports:
      - "8001:8001"
      - "5900:5900"
    environment:
      ERUITAH_SANDBOX_DIR: /tmp/eruitah-sandbox
      ERUITAH_API_PROVIDER: ${ERUITAH_API_PROVIDER:-openai}
      ERUITAH_MODEL_OPENAI: ${ERUITAH_MODEL_OPENAI:-mimo-v2.5}
      ERUITAH_MODEL_ANTHROPIC: ${ERUITAH_MODEL_ANTHROPIC:-claude-sonnet-4-20250514}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ERUITAH_ENABLE_VNC: ${ERUITAH_ENABLE_VNC:-false}
      ERUITAH_SCREEN_WIDTH: ${ERUITAH_SCREEN_WIDTH:-1280}
      ERUITAH_SCREEN_HEIGHT: ${ERUITAH_SCREEN_HEIGHT:-720}
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - /tmp/eruitah-sandbox:/tmp/eruitah-sandbox
      - /tmp/agent-worktrees:/tmp/agent-worktrees
      - ./coding-agent-ui/dist:/app/coding-agent-ui/dist:ro
    networks:
      - eruitah-net

  butcanthic-ai:
    build:
      context: ./butcanthic
      dockerfile: Dockerfile
    container_name: chat-butcanthic
    restart: always
    ports:
      - "8002:8002"
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      HF_ENDPOINT: https://hf-mirror.com
      USE_CELERY: ${USE_CELERY:-false}
    volumes:
      - butcanthic-chroma:/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eruitah-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: chat-ai-service
    restart: always
    ports:
      - "8081:8081"
      - "9999:9999"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD:-12345678}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen3.5-plus}
      MULTIMODAL_API_KEY: ${MULTIMODAL_API_KEY:-}
      MULTIMODAL_BASE_URL: ${MULTIMODAL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      MULTIMODAL_MODEL: ${MULTIMODAL_MODEL:-qwen3.5-omni-flash-2026-03-15}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-https://api.siliconflow.cn}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SERPER_BASE_URL: ${SERPER_BASE_URL:-https://google.serper.dev}
      ALI_ASR_API_KEY: ${ALI_ASR_API_KEY:-}
      ALI_ASR_MODEL: ${ALI_ASR_MODEL:-fun-asr-realtime-2026-02-28}
      ALI_REALTIME_TTS_MODEL: ${ALI_REALTIME_TTS_MODEL:-qwen3-tts-instruct-flash-realtime}
      ALI_REALTIME_TTS_VOICE: ${ALI_REALTIME_TTS_VOICE:-Cherry}
      XIAOMI_TTS_API_KEY: ${XIAOMI_TTS_API_KEY:-}
      XIAOMI_TTS_BASE_URL: ${XIAOMI_TTS_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      XIAOMI_TTS_MODEL: ${XIAOMI_TTS_MODEL:-mimo-v2.5-tts}
      XIAOMI_TTS_VOICE: ${XIAOMI_TTS_VOICE:-冰糖}
      VOICE_STORAGE_PATH: /tmp/audio
      VOICE_URL_PREFIX: http://localhost/audio
      RPC_CPP_HOST: chatserver
      RPC_CPP_PORT: 8888
      RPC_PYTHON_HOST: chat-sandbox
      RPC_PYTHON_PORT: 9997
      RPC_INTERNAL_PORT: 9999
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
      sandbox:
        condition: service_started
      chatserver:
        condition: service_started
    volumes:
      - audio-storage:/tmp/audio
    networks:
      - eruitah-net

  frontend:
    build:
      context: ./coding-agent-ui
      dockerfile: Dockerfile
    container_name: chat-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - sandbox
      - ai-service
    networks:
      - eruitah-net

  nginx:
    image: nginx:1.25-alpine
    container_name: chat-nginx
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chatserver
      - ai-service
      - sandbox
      - butcanthic-ai
    networks:
      - eruitah-net

volumes:
  mysql-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  audio-storage:
  butcanthic-chroma:
  rabbitmq-data:

networks:
  eruitah-net:
    driver: bridge
