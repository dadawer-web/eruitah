syntax = "proto3";

package bridge;

option java_package = "com.bridge.proto";
option java_outer_classname = "ChatProto";
option cc_generic_services = false;

message ChatRequest {
    string session_id = 1;
    string user_id = 2;
    string message = 3;
    int64 timestamp = 4;
    map<string, string> metadata = 5;
}

message ChatResponse {
    string session_id = 1;
    string reply = 2;
    int32 status = 3;
    string error_message = 4;
    int64 timestamp = 5;
    map<string, string> metadata = 6;
}

message RpcMessage {
    enum Type {
        REQUEST = 0;
        RESPONSE = 1;
        ERROR = 2;
    }
    
    Type type = 1;
    int64 id = 2;
    string service_name = 3;
    string method_name = 4;
    bytes payload = 5;
    int32 error_code = 6;
    string error_desc = 7;
}

service ChatService {
    rpc Chat (ChatRequest) returns (ChatResponse);
}
