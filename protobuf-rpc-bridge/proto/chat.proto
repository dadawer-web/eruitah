syntax = "proto3";

package bridge;

option java_package = "com.chat.ai.rpc";
option java_outer_classname = "ChatProto";

// ==================== 聊天核心 ====================

message ChatRequest {
    int32 user_id = 1;
    int32 bot_id = 2;
    string user_name = 3;
    string message = 4;
    string session_id = 5;
    int64 timestamp = 6;
    string voice_url = 7;
    int32 voice_duration = 8;
    map<string, string> metadata = 9;
}

message ChatResponse {
    int32 user_id = 1;
    int32 bot_id = 2;
    string bot_name = 3;
    string message = 4;
    string session_id = 5;
    bool success = 6;
    string error = 7;
    int32 msg_type = 8;
    string voice_url = 9;
    int32 voice_duration = 10;
    int64 timestamp = 11;
    map<string, string> metadata = 12;
}

// ==================== 群聊 ====================

message GroupChatRequest {
    int64 group_id = 1;
    int32 sender_id = 2;
    string sender_name = 3;
    string content = 4;
    repeated int32 ai_bot_ids = 5;
    int64 timestamp = 6;
}

message GroupChatResponse {
    int64 group_id = 1;
    int32 bot_id = 2;
    string bot_name = 3;
    string content = 4;
    bool success = 5;
    string error = 6;
    int64 timestamp = 7;
}

// ==================== 伴读服务 ====================

message CompanionReadRequest {
    int32 user_id = 1;
    string action = 2;
    string text = 3;
}

message CompanionReadResponse {
    string audio_url = 1;
    string explanation_text = 2;
    bool success = 3;
    string error = 4;
}

// ==================== 考情大屏 ====================

message DashboardRequest {
    string user_id = 1;
}

message DashboardResponse {
    repeated double radar = 1;
    repeated int32 line = 2;
    string user_id = 3;
    string update_time = 4;
    string error = 5;
}

message DashboardSummaryRequest {
    string user_id = 1;
}

message DashboardSummaryResponse {
    double avg_mastery = 1;
    string strongest_subject = 2;
    string weakest_subject = 3;
    int32 total_questions_this_week = 4;
    map<string, double> subject_details = 5;
}

message WeeklyReportRequest {
    string user_id = 1;
}

message WeeklyReportResponse {
    string report = 1;
    string user_id = 2;
    string generated_at = 3;
    string error = 4;
}

// ==================== PDF 解析 ====================

message PdfParseRequest {
    bytes pdf_data = 1;
    string filename = 2;
}

message PdfParseResponse {
    string content = 1;
    int32 page_count = 2;
    bool success = 3;
    string error = 4;
}

// ==================== Sandbox 编程沙盒 (eruitah-sandbox) ====================

message SandboxExecuteRequest {
    string prompt = 1;
    string work_dir = 2;
    int32 max_turns = 3;
    string model = 4;
    string api_key = 5;
    string base_url = 6;
    string provider = 7;
    string session_id = 8;
}

message SandboxExecuteResponse {
    string session_id = 1;
    bool success = 2;
    string error = 3;
    string final_result = 4;
    int32 turns_used = 5;
    int64 timestamp = 6;
}

message SandboxTaskRequest {
    string action = 1;
    string task_id = 2;
    string work_dir = 3;
    string target_task_id = 4;
}

message SandboxTaskResponse {
    bool success = 1;
    string action = 2;
    string error = 3;
    string data = 4;
    string task_id = 5;
}

message SandboxToolEvent {
    string session_id = 1;
    string event_type = 2;
    string tool_name = 3;
    string args_json = 4;
    string result = 5;
    bool is_error = 6;
    string content = 7;
    string status_data = 8;
    int64 timestamp = 9;
}

// ==================== Agent Swarm P2P 网络 ====================

message SwarmMessage {
    enum Type {
        REGISTER = 0;
        REGISTER_ACK = 1;
        HEARTBEAT = 2;
        BROADCAST = 3;
        DIRECT = 4;
        HELP_REQUEST = 5;
        HELP_RESPONSE = 6;
        NODE_LIST = 7;
    }

    Type type = 1;
    string from_id = 2;
    string to_id = 3;
    string content = 4;
    string task = 5;
    string result = 6;
    string msg_id = 7;
    repeated string capabilities = 8;
    repeated string specialties = 9;
    int64 timestamp = 10;
}

message SwarmAgentNode {
    string agent_id = 1;
    repeated string capabilities = 2;
    repeated string specialties = 3;
    string status = 4;
    int64 registered_at = 5;
    int64 last_heartbeat = 6;
}

message SwarmRegisterRequest {
    string agent_id = 1;
    repeated string capabilities = 2;
    repeated string specialties = 3;
}

message SwarmRegisterResponse {
    bool success = 1;
    string message = 2;
    int32 node_count = 3;
}

message SwarmHelpRequest {
    string from_id = 1;
    string task = 2;
    double timeout_seconds = 3;
}

message SwarmHelpResponse {
    string from_id = 1;
    string to_id = 2;
    string task = 3;
    string result = 4;
    bool found = 5;
}

message SwarmNodeListResponse {
    repeated SwarmAgentNode nodes = 1;
}

// ==================== C++ ↔ Java 内部路由 (替代 Redis Pub/Sub) ====================

enum InternalMsgType {
    INTERNAL_MSG_TYPE_UNSPECIFIED = 0;
    CHAT_PRIVATE = 1;
    CHAT_GROUP = 2;
    AI_AT_MENTION = 3;
    POINTS_UPDATE = 4;
    AI_GRADE_RESULT = 5;
    COMPANION_READ = 6;
    DASHBOARD_QUERY = 7;
    DASHBOARD_PUSH = 8;
    VOICE_CHAT = 9;
    SYSTEM_NOTIFICATION = 10;
    SANDBOX_EXECUTE = 11;
    EXPERIENCE_UPDATE = 12;
    CAREER_ADVICE = 13;
}

message InternalForwardRequest {
    int32 sender_id = 1;
    int32 receiver_id = 2;
    int64 group_id = 3;
    InternalMsgType msg_type = 4;
    string payload_json = 5;
    string trace_id = 6;
    int64 timestamp = 7;
    map<string, string> headers = 8;
}

message InternalForwardResponse {
    bool success = 1;
    string error = 2;
    string trace_id = 3;
    bytes result_payload = 4;
}

message InternalPushRequest {
    int32 sender_id = 1;
    int32 receiver_id = 2;
    int64 group_id = 3;
    InternalMsgType msg_type = 4;
    string payload_json = 5;
    string trace_id = 6;
    int64 timestamp = 7;
    bool broadcast = 8;
    map<string, string> headers = 9;
}

message InternalPushResponse {
    bool success = 1;
    string error = 2;
    string trace_id = 3;
    int32 delivered_count = 4;
}

// ==================== AI 职业导师 ====================

message CareerAdviceRequest {
    int64 user_id = 1;
    repeated string skills = 2;
    string resume_highlight = 3;
    string learning_advice = 4;
}

message CareerAdviceResponse {
}

service InternalRouterService {
    rpc ForwardToJava(InternalForwardRequest) returns (InternalForwardResponse);
    rpc PushToClient(InternalPushRequest) returns (InternalPushResponse);
    rpc StreamToClient(InternalPushRequest) returns (stream InternalPushResponse);
    rpc UpdateCareerProfile(CareerAdviceRequest) returns (CareerAdviceResponse);
}

// ==================== RPC 消息封装 ====================

message RpcMessage {
    enum Type {
        REQUEST = 0;
        RESPONSE = 1;
        ERROR = 2;
        STREAM = 3;
        STREAM_END = 4;
    }

    Type type = 1;
    int64 id = 2;
    string service_name = 3;
    string method_name = 4;
    bytes payload = 5;
    int32 error_code = 6;
    string error_desc = 7;
}
