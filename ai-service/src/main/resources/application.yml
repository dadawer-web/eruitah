server:
  port: 8081

spring:
  codec:
    max-in-memory-size: 10MB
  application:
    name: ai-service
  mvc:
    throw-exception-if-no-handler-found: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2KB
  neo4j:
    uri: bolt://${SPRING_NEO4J_URI:localhost:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:12345678}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:123456}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:admin}
    password: ${SPRING_RABBITMQ_PASSWORD:eruitah2026}
    publisher-confirm-type: correlated
    publisher-returns: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://token-plan-cn.xiaomimimo.com}
      chat:
        options:
          model: ${OPENAI_MODEL:mimo-v2.5-pro}
          temperature: 0.7
      enabled: true
    vectorstore:
      redis:
        initialize-schema: true
        index-name: rag-knowledge-index
        prefix: "rag:doc:"
  web:
    resources:
      static-locations: classpath:/static/,file:/tmp/audio/

multimodal:
  openai:
    api-key: ${MULTIMODAL_API_KEY:}
    base-url: ${MULTIMODAL_BASE_URL:https://token-plan-cn.xiaomimimo.com}
    model: ${MULTIMODAL_MODEL:mimo-v2.5-pro}
    temperature: 0.7

embedding:
  siliconflow:
    api-key: ${EMBEDDING_API_KEY:}
    base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    model: ${EMBEDDING_MODEL:BAAI/bge-m3}

reranker:
  siliconflow:
    api-key: ${RERANKER_API_KEY:}
    base-url: ${RERANKER_BASE_URL:https://api.siliconflow.cn}
    model: ${RERANKER_MODEL:BAAI/bge-reranker-v2-m3}
    top-n: 3

chat:
  memory:
    max-history: 10
    ttl-minutes: 30

group:
  chat:
    max-messages: 100
    ttl-hours: 24

logging:
  level:
    com.chat.ai: DEBUG
    org.springframework.ai: DEBUG

serper:
  api-key: ${SERPER_API_KEY:}
  base-url: ${SERPER_BASE_URL:https://google.serper.dev}

voice:
  aliyun:
    api-key: ${ALI_ASR_API_KEY:}
    asr-model: ${ALI_ASR_MODEL:fun-asr-realtime-2026-02-28}
    realtime-tts-model: ${ALI_REALTIME_TTS_MODEL:qwen3-tts-instruct-flash-realtime}
    realtime-tts-voice: ${ALI_REALTIME_TTS_VOICE:Cherry}
  xiaomi:
    api-key: ${XIAOMI_TTS_API_KEY:}
    base-url: ${XIAOMI_TTS_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
    tts-model: ${XIAOMI_TTS_MODEL:mimo-v2.5-tts}
    tts-voice: ${XIAOMI_TTS_VOICE:冰糖}
  storage:
    path: ${VOICE_STORAGE_PATH:/tmp/audio}
    url-prefix: ${VOICE_URL_PREFIX:http://localhost/audio}

app:
  ai:
    structured-max-attempts: 2
    structured-include-last-error: true
    structured-retry-use-repair-prompt: true
    structured-retry-append-strict-json-instruction: true
    structured-error-message-max-length: 200
    structured-metrics-enabled: true

rpc:
  cpp:
    host: ${RPC_CPP_HOST:127.0.0.1}
    port: ${RPC_CPP_PORT:8888}
  python:
    host: ${RPC_PYTHON_HOST:127.0.0.1}
    port: ${RPC_PYTHON_PORT:9997}
  internal:
    port: ${RPC_INTERNAL_PORT:9999}
