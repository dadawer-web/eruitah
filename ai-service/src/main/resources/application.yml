server:
  port: 8081

spring:
  application:
    name: ai-service
  mvc:
    throw-exception-if-no-handler-found: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2KB
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: 12345678
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  ai:
    openai:
      api-key:  
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.5-plus
          temperature: 0.7
      enabled: true
    vectorstore:
      redis:
        initialize-schema: true
        index-name: rag-knowledge-index
        prefix: "rag:doc:"
  web:
    resources:
      static-locations: classpath:/static/,file:/tmp/audio/

multimodal:
  openai:
    api-key:  
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    model: qwen3.5-omni-flash-2026-03-15
    temperature: 0.7

embedding:
  siliconflow:
    api-key:  
    base-url: https://api.siliconflow.cn
    model: BAAI/bge-m3

reranker:
  siliconflow:
    api-key:  
    base-url: https://api.siliconflow.cn
    model: BAAI/bge-reranker-v2-m3
    top-n: 3

chat:
  memory:
    max-history: 10
    ttl-minutes: 30

group:
  chat:
    max-messages: 100
    ttl-hours: 24

logging:
  level:
    com.chat.ai: DEBUG
    org.springframework.ai: DEBUG

serper:
  api-key: 
  base-url: https://google.serper.dev

voice:
  dashscope:
    api-key:  
    asr-model: fun-asr-realtime-2026-02-28
    tts-model: qwen3-tts-instruct-flash-realtime
    tts-voice: Cherry
  storage:
    path: /tmp/audio
    url-prefix: http://localhost:8081/audio

app:
  ai:
    structured-max-attempts: 2
    structured-include-last-error: true
    structured-retry-use-repair-prompt: true
    structured-retry-append-strict-json-instruction: true
    structured-error-message-max-length: 200
    structured-metrics-enabled: true
