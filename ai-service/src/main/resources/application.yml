server:
  port: 8081

spring:
  application:
    name: ai-service
  mvc:
    throw-exception-if-no-handler-found: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2KB
  neo4j:
    uri: bolt://${SPRING_NEO4J_URI:neo4j:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:12345678}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:123456}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:qwen3.5-plus}
          temperature: 0.7
      enabled: true
    vectorstore:
      redis:
        initialize-schema: true
        index-name: rag-knowledge-index
        prefix: "rag:doc:"
  web:
    resources:
      static-locations: classpath:/static/,file:/tmp/audio/

multimodal:
  openai:
    api-key: ${MULTIMODAL_OPENAI_API_KEY:}
    base-url: ${MULTIMODAL_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    model: ${MULTIMODAL_OPENAI_MODEL:qwen3.5-omni-flash-2026-03-15}
    temperature: 0.7

embedding:
  siliconflow:
    api-key: ${EMBEDDING_SILICONFLOW_API_KEY:}
    base-url: ${EMBEDDING_SILICONFLOW_BASE_URL:https://api.siliconflow.cn}
    model: ${EMBEDDING_SILICONFLOW_MODEL:BAAI/bge-m3}

reranker:
  siliconflow:
    api-key: ${RERANKER_SILICONFLOW_API_KEY:}
    base-url: ${RERANKER_SILICONFLOW_BASE_URL:https://api.siliconflow.cn}
    model: ${RERANKER_SILICONFLOW_MODEL:BAAI/bge-reranker-v2-m3}
    top-n: 3

chat:
  memory:
    max-history: 10
    ttl-minutes: 30

group:
  chat:
    max-messages: 100
    ttl-hours: 24

logging:
  level:
    com.chat.ai: DEBUG
    org.springframework.ai: DEBUG

serper:
  api-key: ${SERPER_API_KEY:}
  base-url: ${SERPER_BASE_URL:https://google.serper.dev}

voice:
  dashscope:
    api-key: ${VOICE_DASHSCOPE_API_KEY:}
    asr-model: ${VOICE_DASHSCOPE_ASR_MODEL:fun-asr-realtime-2026-02-28}
    tts-model: ${VOICE_DASHSCOPE_TTS_MODEL:qwen3-tts-instruct-flash-realtime}
    tts-voice: ${VOICE_DASHSCOPE_TTS_VOICE:Cherry}
  storage:
    path: ${VOICE_STORAGE_PATH:/tmp/audio}
    url-prefix: ${VOICE_STORAGE_URL_PREFIX:http://localhost/audio}

app:
  ai:
    structured-max-attempts: 2
    structured-include-last-error: true
    structured-retry-use-repair-prompt: true
    structured-retry-append-strict-json-instruction: true
    structured-error-message-max-length: 200
    structured-metrics-enabled: true
