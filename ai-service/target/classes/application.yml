server:
  port: 8081

spring:
  application:
    name: ai-service
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  ai:
    openai:
      api-key: sk-8ebb4900479f41f48ace59abe396db6e
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.5-flash
          temperature: 0.7
      enabled: true
    vectorstore:
      redis:
        initialize-schema: true
        index-name: rag-knowledge-index
        prefix: "rag:doc:"

embedding:
  siliconflow:
    api-key: sk-anuigbzjgxlordwizutkeivljljdlhobvrhcbhrkoqnuhhst
    base-url: https://api.siliconflow.cn
    model: BAAI/bge-m3

chat:
  memory:
    max-history: 10
    ttl-minutes: 30

group:
  chat:
    max-messages: 100
    ttl-hours: 24

logging:
  level:
    com.chat.ai: DEBUG
    org.springframework.ai: DEBUG
