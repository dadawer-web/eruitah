<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>408 认知地图 - 折叠树</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #0d1b2a; 
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #main { 
            width: 100%; 
            height: 100%; 
        }
        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(26, 26, 46, 0.9);
            border-radius: 12px;
            padding: 16px 20px;
            color: #e0e0e0;
            font-size: 13px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid #2a2a3e;
            z-index: 100;
        }
        #stats h3 {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: #7ec8e3;
            border-bottom: 1px solid #2a2a3e;
            padding-bottom: 8px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
        }
        .stat-label { color: #9ca3af; }
        .stat-value { font-weight: bold; }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(26, 26, 46, 0.9);
            border-radius: 12px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid #2a2a3e;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 4px 0;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            margin-right: 8px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #7ec8e3;
            font-size: 16px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="loading">加载中...</div>
    <div id="main"></div>
    <div id="stats" style="display:none;">
        <h3>📊 学习统计</h3>
        <div class="stat-row">
            <span class="stat-label">已掌握</span>
            <span class="stat-value" id="mastered-count" style="color:#22c55e;">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">熟悉中</span>
            <span class="stat-value" id="familiar-count" style="color:#eab308;">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">待加强</span>
            <span class="stat-value" id="weak-count" style="color:#ef4444;">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">未开始</span>
            <span class="stat-value" id="notstarted-count" style="color:#6b7280;">0</span>
        </div>
        <div class="stat-row" style="margin-top:10px;border-top:1px solid #2a2a3e;padding-top:10px;">
            <span class="stat-label">平均掌握度</span>
            <span class="stat-value" id="avg-mastery">0%</span>
        </div>
    </div>
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background:#22c55e;"></div>
            <span>已掌握 (≥70%)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#eab308;"></div>
            <span>熟悉中 (40-70%)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#ef4444;"></div>
            <span>待加强 (<40%)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#4b5563;"></div>
            <span>未学习</span>
        </div>
    </div>
    <script>
        var myChart = echarts.init(document.getElementById('main'), null, { renderer: 'canvas' });
        var currentUserId = null;

        function getMasteryColor(mastery) {
            if (mastery >= 0.7) return '#22c55e';
            if (mastery >= 0.4) return '#eab308';
            if (mastery > 0) return '#ef4444';
            return '#4b5563';
        }

        function processTreeData(node, depth) {
            if (!depth) depth = 0;
            var processed = {
                name: node.name,
                mastery: node.mastery || 0,
                size: node.size || 5,
                level: node.level || depth,
                subject: node.subject,
                itemStyle: {
                    color: getMasteryColor(node.mastery || 0),
                    borderColor: '#2a2a3e',
                    borderWidth: 2
                },
                label: {
                    color: '#e0e0e0',
                    fontSize: Math.max(11, 15 - depth),
                    fontWeight: depth < 2 ? 'bold' : 'normal'
                },
                lineStyle: {
                    color: 'rgba(74, 78, 105, 0.6)',
                    width: Math.max(1, 3 - depth)
                }
            };

            if (node.children && node.children.length > 0) {
                processed.children = node.children.map(function(child) {
                    return processTreeData(child, depth + 1);
                });
            }

            return processed;
        }

        function renderTree(treeData, stats) {
            document.getElementById('loading').style.display = 'none';
            
            var processedData = processTreeData(treeData);
            
            if (stats) {
                document.getElementById('stats').style.display = 'block';
                document.getElementById('mastered-count').textContent = stats.mastered || 0;
                document.getElementById('familiar-count').textContent = stats.familiar || 0;
                document.getElementById('weak-count').textContent = stats.weak || 0;
                document.getElementById('notstarted-count').textContent = stats.notStarted || 0;
                document.getElementById('avg-mastery').textContent = 
                    ((stats.averageMastery || 0) * 100).toFixed(1) + '%';
            }

            var option = {
                backgroundColor: '#0d1b2a',
                tooltip: {
                    trigger: 'item',
                    triggerOn: 'mousemove',
                    backgroundColor: 'rgba(26, 26, 46, 0.95)',
                    borderColor: '#4a4e69',
                    borderWidth: 1,
                    padding: [10, 15],
                    textStyle: {
                        color: '#e0e0e0',
                        fontSize: 13
                    },
                    formatter: function(params) {
                        var data = params.data;
                        var mastery = (data.mastery || 0) * 100;
                        var size = data.size || 5;
                        var level = data.level || 0;
                        var masteryText = mastery >= 70 ? '已掌握' : 
                                         mastery >= 40 ? '熟悉中' : 
                                         mastery > 0 ? '待加强' : '未学习';
                        return '<div style="font-weight:bold;margin-bottom:6px;color:#7ec8e3;">' + 
                               data.name + '</div>' +
                               '<div>掌握度: <span style="color:' + getMasteryColor(data.mastery) + '">' + 
                               mastery.toFixed(1) + '%</span> (' + masteryText + ')</div>' +
                               '<div>知识点体量: ' + size + '</div>' +
                               '<div>层级: ' + level + '</div>';
                    }
                },
                series: [{
                    type: 'tree',
                    data: [processedData],
                    top: '5%',
                    left: '15%',
                    bottom: '5%',
                    right: '20%',
                    symbolSize: function(value, params) {
                        var level = params.data.level || 0;
                        var size = params.data.size || 5;
                        var baseSize = Math.max(8, 20 - level * 2);
                        return baseSize + (10 - size);
                    },
                    initialTreeDepth: 2,
                    expandAndCollapse: true,
                    animationDuration: 550,
                    animationDurationUpdate: 750,
                    animationEasing: 'cubicOut',
                    animationEasingUpdate: 'cubicInOut',
                    layout: 'orthogonal',
                    orient: 'LR',
                    label: {
                        position: 'right',
                        verticalAlign: 'middle',
                        align: 'left'
                    },
                    leaves: {
                        label: {
                            position: 'right',
                            verticalAlign: 'middle',
                            align: 'left'
                        }
                    },
                    emphasis: {
                        focus: 'descendant',
                        itemStyle: {
                            borderWidth: 3,
                            borderColor: '#7ec8e3',
                            shadowBlur: 10,
                            shadowColor: 'rgba(126, 200, 227, 0.5)'
                        }
                    },
                    lineStyle: {
                        curveness: 0.5
                    }
                }]
            };

            myChart.setOption(option, true);

            myChart.on('click', function(params) {
                if (params.data && params.data.name) {
                    console.log('Clicked node:', params.data.name, 'Mastery:', params.data.mastery);
                    if (window.qt && window.qt.onNodeClick) {
                        window.qt.onNodeClick(params.data.name, params.data.mastery);
                    }
                }
            });
        }

        function renderEmpty() {
            document.getElementById('loading').style.display = 'none';
            var option = {
                backgroundColor: '#0d1b2a',
                title: {
                    text: '🌳 408认知地图',
                    subtext: '加载中或暂无数据...',
                    left: 'center',
                    top: 'center',
                    textStyle: {
                        color: '#7ec8e3',
                        fontSize: 24
                    },
                    subtextStyle: {
                        color: '#6b7280',
                        fontSize: 14
                    }
                }
            };
            myChart.setOption(option);
        }

        function renderGraph(graphData) {
            renderEmpty();
        }

        function loadTree(userId) {
            currentUserId = userId;
            document.getElementById('loading').style.display = 'block';
            console.log('Loading tree for user:', userId);
        }

        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
