# ============================================================
# runtime-only 编排：服务器只运行预编译制品，不在容器内编译
# 前置：已执行 build-local.sh + transfer.sh，dist/ 已就位
# ============================================================
services:

  # ---------- C++ ChatServer ----------
  cpp-server:
    build:
      context: ./dist/cpp-server
      dockerfile: Dockerfile
    ports:
      - "6000:6000"   # 客户端连接
      - "8888:8888"   # RPC 监听（AI Service 回推职业建议等）
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-xieming562}
      - MYSQL_DATABASE=chat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123456}
      - JAVA_RPC_HOST=ai-service
      - JAVA_RPC_PORT=9999
      - RPC_LISTEN_PORT=8888
    depends_on: [mysql, redis]
    restart: unless-stopped

  # ---------- Java ai-service ----------
  ai-service:
    build:
      context: ./dist/ai-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"   # HTTP API
      - "9999:9999"   # RPC（供 C++ 调用）
    env_file:
      - ./dist/ai-service/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123456}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-xieming562}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-eruitah2026}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-eruitah2026}
      - BUTCANTHIC_URL=http://butcanthic:8002
      - SANDBOX_URL=http://sandbox:8001
    depends_on: [mysql, redis, neo4j, rabbitmq]
    restart: unless-stopped

  # ---------- Python butcanthic ----------
  butcanthic:
    build:
      context: ./dist/butcanthic
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123456}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-eruitah2026}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-eruitah2026}
      - JWT_SECRET=${JWT_SECRET:-eruitah-secret-key}
    depends_on: [redis, neo4j, rabbitmq]
    restart: unless-stopped

  # ---------- Python eruitah-sandbox ----------
  sandbox:
    build:
      context: ./dist/sandbox
      dockerfile: Dockerfile
    ports:
      - "8001:8001"   # HTTP API
      - "5900:5900"   # VNC（可选）
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123456}
      - AI_SERVICE_URL=http://ai-service:8081
      - ERUITAH_SCREEN_WIDTH=1280
      - ERUITAH_SCREEN_HEIGHT=720
    depends_on: [redis]
    restart: unless-stopped

  # ---------- 基础设施 ----------
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-xieming562}
      - MYSQL_DATABASE=chat
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-eruitah2026}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-eruitah2026}
    ports:
      - "15672:15672"  # 管理界面
      - "1883:1883"    # MQTT（桌宠订阅）
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  neo4j_data:
