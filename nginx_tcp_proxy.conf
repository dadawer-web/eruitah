# Nginx TCP负载均衡配置示例
# 用于将公网流量转发到聊天服务器

stream {
    # 定义后端服务器组
    upstream chat_backend {
        # 服务器节点：权重1，最大失败次数3次，失败超时30秒
        server 127.0.0.1:6000 weight=1 max_fails=3 fail_timeout=30s;
        # 如果有多个服务器实例，可以继续添加
        # server 127.0.0.1:6001 weight=1 max_fails=3 fail_timeout=30s;
    }

    server {
        # 监听公网端口，例如8000
        listen 8000;
        # 连接超时时间
        proxy_connect_timeout 5s;
        # 代理超时时间
        proxy_timeout 30s;
        # 将请求转发到后端服务器组
        proxy_pass chat_backend;
        # 禁用Nagle算法，提高实时性
        tcp_nodelay on;
    }
}

