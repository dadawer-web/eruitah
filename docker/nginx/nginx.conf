worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    upstream chat_backend {
        server chatserver:6000 weight=1 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        proxy_pass chat_backend;
        tcp_nodelay on;
    }
}

http {
    upstream ai_backend {
        server ai-service:8081;
    }

    upstream sandbox_backend {
        server eruiah-sandbox:8001;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://ai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /audio/ {
            proxy_pass http://ai_backend;
            proxy_set_header Host $host;
        }

        location /ws/ {
            proxy_pass http://ai_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location /sandbox/ {
            proxy_pass http://sandbox_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /sandbox/ws/coding {
            proxy_pass http://sandbox_backend/ws/coding;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location /ide {
            proxy_pass http://sandbox_backend/ide;
            proxy_set_header Host $host;
        }
    }
}
